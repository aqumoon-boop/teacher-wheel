<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>課堂幸運抽抽樂</title>
<style>
body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#fff3b0,#bdefff,#ffd6e8);text-align:center;color:#333}
.app{max-width:760px;margin:auto;padding:24px}
h1{font-size:42px;color:#ff7a30;text-shadow:3px 3px #fff}
textarea{width:100%;height:190px;border-radius:24px;border:5px solid #fff;padding:16px;font-size:22px;box-sizing:border-box}
button{border:0;border-radius:999px;padding:18px 28px;margin:10px;font-size:24px;font-weight:bold;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.save{background:#20c997}.reset{background:#ff7a59}.spin{background:#ff5d8f;font-size:34px;width:90%;max-width:460px}
.wheel{width:330px;height:330px;border-radius:50%;margin:28px auto;border:12px solid #fff;background:conic-gradient(#ffe066,#7de2d1,#7cc9ff,#ff9f45,#ff8fab,#a78bfa,#ffe066);display:flex;align-items:center;justify-content:center;transition:transform 3s cubic-bezier(.12,.74,.18,1);box-shadow:0 16px 28px rgba(0,0,0,.22)}
.center{background:#fff;border-radius:50%;width:155px;height:155px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;color:#ff7a30;padding:12px}
.info{font-size:22px;font-weight:bold;margin:14px}
.result{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:5}
.card{background:white;border-radius:36px;padding:32px;width:85%;max-width:620px;border:8px solid #ffe066}
.winner{font-size:56px;color:#ff6b35;font-weight:bold;margin:22px 0;word-break:break-word}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
@media(max-width:600px){h1{font-size:32px}.wheel{width:300px;height:300px}.winner{font-size:44px}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app">
<h1>🎡 課堂幸運抽抽樂</h1>
<textarea id="names" placeholder="輸入學生名單，一行一位&#10;例如：&#10;1 王小明&#10;2 林小華&#10;3 陳小美"></textarea><br>
<button class="save" onclick="saveNames()">確認儲存</button>
<button class="reset" onclick="resetDraw()">重新抽籤</button>
<div class="info" id="info">請先輸入名單</div>
<div class="wheel" id="wheel"><div class="center" id="center">READY</div></div>
<button class="spin" onclick="draw()">🎉 開始抽籤 🎉</button>
</div>
<div class="result" id="result">
<div class="card">
<div style="font-size:30px;font-weight:bold">🎊 抽中的學生是 🎊</div>
<div class="winner" id="winner">---</div>
<button class="save" onclick="closeResult()">再抽一次</button>
</div>
</div>
<script>
let students=[],remaining=[],drawn=[],rotation=0;
window.onload=()=>{let s=localStorage.getItem("studentNames");if(s){names.value=s;saveNames()}};
function parse(t){return t.split(/[\n,，、]+/).map(x=>x.trim()).filter(Boolean)}
function saveNames(){students=[...new Set(parse(names.value))];remaining=[...students];drawn=[];localStorage.setItem("studentNames",names.value);update()}
function resetDraw(){remaining=[...students];drawn=[];update()}
function update(){info.innerText=students.length?`總人數 ${students.length}｜已抽 ${drawn.length}｜剩餘 ${remaining.length}`:"請先輸入名單";center.innerText=remaining.length?`剩餘 ${remaining.length}`:"抽完囉"}
function draw(){
if(!students.length){alert("請先輸入並儲存名單");return}
if(!remaining.length){alert("全部都抽過囉，請按重新抽籤");return}
let i=Math.floor(Math.random()*remaining.length),name=remaining[i];
rotation+=1440+Math.floor(Math.random()*720);
wheel.style.transform=`rotate(${rotation}deg)`;
center.innerText="抽籤中";
setTimeout(()=>{remaining.splice(i,1);drawn.push(name);winner.innerText=name;result.style.display="flex";update();confetti();sound()},3000)
}
function closeResult(){result.style.display="none"}
function sound(){try{let c=new AudioContext();[523,659,784,1046].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.15,c.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.1+.2);o.start(c.currentTime+i*.1);o.stop(c.currentTime+i*.1+.22)})}catch(e){}}
function confetti(){
let canvas=document.getElementById("confetti"),ctx=canvas.getContext("2d");canvas.width=innerWidth;canvas.height=innerHeight;
let p=Array.from({length:170},()=>({x:Math.random()*canvas.width,y:-20,s:6+Math.random()*9,v:2+Math.random()*5,c:["#ffe066","#7de2d1","#7cc9ff","#ff9f45","#ff8fab","#a78bfa"][Math.floor(Math.random()*6)]}));
let t=0;function d(){ctx.clearRect(0,0,canvas.width,canvas.height);p.forEach(a=>{a.y+=a.v;a.x+=Math.sin(a.y/25);ctx.fillStyle=a.c;ctx.fillRect(a.x,a.y,a.s,a.s)});if(t++<180)requestAnimationFrame(d);else ctx.clearRect(0,0,canvas.width,canvas.height)}d()
}
</script>
</body>
</html>
